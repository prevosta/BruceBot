[tool.poetry]
name = "ares-sc2-starter-bot"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
packages = [{include = "ares-sc2/src/ares"}]

[tool.poetry.dependencies]
ares-sc2 = { path = "ares-sc2", develop = false }
python = ">=3.11, <3.13"
ruff = "^0.1.0"
pyright = "^1.1.0"
requests = "^2.32.3"
pyinstaller = "^6.14.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = ["ares-sc2/*"]

[tool.pyright]
include = ["bot", "run.py", "ladder.py", "scripts"]
exclude = ["ares-sc2", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["ares-sc2/src"]
